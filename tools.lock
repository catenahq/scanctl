# Pinned scanner versions. The runner reads `version`; for a tool it fetches
# from a GitHub release, also `repo` and `sha256`: the digest of each release
# file of that version for linux amd64, keyed by the file's path under
# https://github.com/<repo>/releases/download/. Renovate bumps `version` via the
# customManager in renovate.json and runs `scanctl refresh-digests` in the same
# branch, which rewrites `sha256`. Asset naming + download logic live in
# scanctl/internal/runner (typed Go). Do not hand-edit versions -- let Renovate PR them
# so the bump is scanned + reviewed like any other dependency change.
tools:
  trivy:
    repo: aquasecurity/trivy
    # renovate: datasource=github-releases depName=aquasecurity/trivy
    version: 0.76.1
    sha256:
      v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
