name: scanctl (seed baseline)

# Reusable workflow: on demand, runs scanctl against a repo and opens a PR
# proposing .scanctl/baseline.sarif. This is the mechanical half of seeding a
# baseline -- the runner here has real network access to fetch the scanners,
# which a sandboxed dev environment may not. The PR is the review gate:
# nothing suppresses on the gate or dismisses on GitHub until a human reads
# every finding and merges it (baseline.Apply / --dismiss-baseline only ever
# act on a COMMITTED .scanctl/baseline.sarif on the default branch). This
# workflow deliberately does NOT auto-commit to the default branch -- see
# scanctl's README, "Seeding or regenerating a baseline", for why a baseline
# must be a reviewed, not generated, artifact.
#
# No-ops (no PR) when .scanctl/baseline.sarif already exists: reseeding after
# drift is its own deliberate act (delete the file first, or run this with
# workflow_dispatch after removing it) -- this workflow only ever proposes an
# INITIAL baseline.

on:
  workflow_call:
    inputs:
      path:
        description: repo subpath to scan
        type: string
        default: "."
      profile:
        description: profile override ("full" runs resale-restricted tools)
        type: string
        default: full
      runner:
        description: runs-on label
        type: string
        default: ubuntu-latest

jobs:
  seed:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: true # this job pushes a branch, unlike security.yml's scan-only checkouts

      - name: Check for an existing baseline
        id: check
        working-directory: ${{ inputs.path }}
        run: |
          if [ -f .scanctl/baseline.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo ".scanctl/baseline.sarif already exists -- nothing to seed. Delete it first to propose a fresh one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Install uv
        if: steps.check.outputs.exists == 'false'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install scanctl
        if: steps.check.outputs.exists == 'false'
        env:
          GOPRIVATE: github.com/catenahq/*
        run: go install github.com/catenahq/scanctl/cmd/scanctl@main

      - name: Generate the proposed baseline
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
        working-directory: ${{ inputs.path }}
        run: |
          "$(go env GOPATH)/bin/scanctl" run --profile "$PROFILE" \
            --out /tmp/scanctl-seed-current.sarif --summary /dev/null .
          mkdir -p .scanctl
          python3 - <<'PY'
          import json
          rep = json.load(open("/tmp/scanctl-seed-current.sarif"))
          runs = [
              {"tool": {"driver": {"name": r["tool"]["driver"]["name"]}}, "results": r["results"]}
              for r in rep.get("runs", []) if r.get("results")
          ]
          out = {"$schema": rep["$schema"], "version": rep["version"], "runs": runs}
          json.dump(out, open(".scanctl/baseline.sarif", "w"), indent=2)
          open(".scanctl/baseline.sarif", "a").write("\n")
          PY

      - name: Summarize findings for the PR body
        if: steps.check.outputs.exists == 'false'
        id: summary
        working-directory: ${{ inputs.path }}
        run: |
          {
            echo 'body<<SUMMARY_EOF'
            python3 - <<'PY'
          import json
          from collections import Counter
          rep = json.load(open(".scanctl/baseline.sarif"))
          c = Counter()
          for run in rep["runs"]:
              tool = run["tool"]["driver"]["name"]
              for r in run["results"]:
                  c[(tool, r.get("ruleId", ""))] += 1
          total = sum(c.values())
          print(f"{total} finding(s) across {len(rep['runs'])} tool run(s):")
          print()
          for (tool, rule), n in sorted(c.items()):
              print(f"- {n}x `{tool}` `{rule}`")
          PY
            echo 'SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open (or update) the proposal PR
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            Machine-generated by scanctl's seed-baseline workflow. **Review every
            finding below before merging** -- merging accepts each one as
            known/benign: it stops gating CI (`--baseline`) and, once
            `--dismiss-baseline` next runs, closes the matching GitHub
            code-scanning alert.

            Delete any entry that is NOT actually benign and re-run this
            workflow (or seed locally per scanctl's README) instead of
            merging it as-is. Add `.scanctl/README.md` recording what's
            baselined and why (see `catenahq/docs/.scanctl/README.md` for the
            expected shape) as part of reviewing this PR.

            ${{ steps.summary.outputs.body }}
        working-directory: ${{ inputs.path }}
        run: |
          branch="scanctl/seed-baseline"
          git config user.name "scanctl-bot"
          git config user.email "scanctl-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add .scanctl/baseline.sarif
          git commit -m "scanctl: propose initial .scanctl/baseline.sarif"
          git push --force origin "HEAD:$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --body "$BODY"
          else
            gh pr create --title "scanctl: propose initial baseline" --head "$branch" --body "$BODY"
          fi
