name: scanctl

# Reusable workflow: drop one call into any repo to run the scanctl bundle.
# scanctl is fetched with `go install` (tools.lock is embedded, so the scanner
# pins travel with it); the scanners themselves are lazy-fetched at scan time.
# Findings in the repo's own tree, and in an image the repo builds (pre-scan +
# own-images), gate on every run. CVEs in the images it pins gate only when a
# pull_request or push introduces them; scanctl reads the commit to compare
# with from the event.
#
# The caller's job must grant all three permissions below: GitHub refuses to
# start a run whose called job asks for more than the caller granted.
#
# Caller example:
#   jobs:
#     security:
#       uses: catenahq/scanctl/.github/workflows/github-reusable.yml@main
#       with:
#         scanctl-version: v0.1.0
#         # baseline: .scanctl/baseline.sarif   # optional: findings accepted for good
#         # pre-scan: docker buildx build -t app:ci .   # optional: build an own image
#         # own-images: app:ci                           # gated on every run
#       # secrets:                 # optional: Docker Hub pulls, logged in
#       #   DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
#       #   DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
#       permissions:
#         contents: read
#         security-events: write   # code-scanning upload (public / GHAS only)
#         pull-requests: write     # sticky findings comment (needed on private repos)

on:
  workflow_call:
    inputs:
      scanctl-version:
        description: scanctl module version (tag) to install
        type: string
        default: latest
      path:
        description: repo subpath to scan
        type: string
        default: "."
      no-gate:
        description: scan + report but never fail the build
        type: boolean
        default: false
      profile:
        description: profile override ("full" runs resale-restricted tools, e.g. semgrep registry packs); empty = config default
        type: string
        default: ""
      baseline:
        description: optional committed baseline SARIF of findings accepted for good; they are suppressed on every run, and an entry the scan no longer produces fails it (missing file = no-op)
        type: string
        default: ""
      dismiss-baseline:
        description: also close the matching GitHub code-scanning alert for every finding the baseline accepted (GitHub does not act on SARIF "external" suppressions on its own). Only applies when baseline is set; always skipped on pull_request events.
        type: boolean
        default: true
      import-sarif:
        description: path to an externally-produced SARIF (e.g. a CodeQL job's output) to fold into the merge
        type: string
        default: ""
      runner:
        description: runs-on label
        type: string
        default: ubuntu-latest
      pre-scan:
        description: shell commands run in the checkout before the scan, e.g. the docker build of an image passed in own-images
        type: string
        default: ""
      own-images:
        description: whitespace-separated refs of images this repo builds (in pre-scan); their CVEs gate on every run (--own-image)
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub user; with DOCKERHUB_TOKEN, image pulls run logged in, under the account's rate limit
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub access token for DOCKERHUB_USERNAME
        required: false

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    permissions:
      contents: read
      security-events: write
      # PR-level finding comment for private repos (no Advanced Security). Only
      # exercised on pull_request events; harmless on push.
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # full history so gitleaks scans past commits
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Install uv
        # uv backs the Python scanners (semgrep, guarddog), lazy-fetched at scan time.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install scanctl
        # A scanctl branch named like the caller's (a pull request's head, then
        # its base) wins over scanctl-version, so a scanctl change runs against
        # each caller's branch of the same name before it merges. It installs
        # by commit: a branch name is not always a valid Go version query.
        env:
          SCANCTL_VERSION: ${{ inputs.scanctl-version }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          # Resolve catenahq modules straight from git, not proxy.golang.org:
          # the proxy caches branch resolution (~30 min), so @main could
          # install a scanctl OLDER than the workflow that invokes it.
          GOPRIVATE: github.com/catenahq/*
        run: |
          set -euo pipefail
          candidates=()
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            candidates=("$HEAD_REF" "$BASE_REF")
          elif [ "$REF_TYPE" = branch ]; then
            candidates=("$REF_NAME")
          fi
          version="$SCANCTL_VERSION"
          for b in "${candidates[@]}"; do
            [ -n "$b" ] || continue
            sha="$(git ls-remote https://github.com/catenahq/scanctl.git "refs/heads/$b" | cut -f1)"
            if [ -n "$sha" ]; then
              version="$sha"
              echo "scanctl from its $b branch at $sha"
              break
            fi
          done
          go install "github.com/catenahq/scanctl/cmd/scanctl@${version}"
      - name: Docker Hub login
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Pre-scan
        if: inputs.pre-scan != ''
        env:
          PRE_SCAN: ${{ inputs.pre-scan }}
        run: bash -euo pipefail -c "$PRE_SCAN"
      - name: Run scanctl
        env:
          # zizmor's API-backed audits use this when present; absent = it runs --offline.
          GH_TOKEN: ${{ github.token }}
          # Inputs routed through env vars, not interpolated into the run: script
          # (zizmor template-injection: untrusted-context-into-shell sink).
          NO_GATE: ${{ inputs.no-gate }}
          PROFILE: ${{ inputs.profile }}
          SCAN_PATH: ${{ inputs.path }}
          BASELINE: ${{ inputs.baseline }}
          DISMISS_BASELINE: ${{ inputs.dismiss-baseline }}
          IMPORT_SARIF: ${{ inputs.import-sarif }}
          OWN_IMAGES: ${{ inputs.own-images }}
        run: |
          gate_flag=""
          if [ "$NO_GATE" = "true" ]; then gate_flag="--no-gate"; fi
          profile_flag=""
          if [ -n "$PROFILE" ]; then profile_flag="--profile $PROFILE"; fi
          baseline_flag=""
          if [ -n "$BASELINE" ]; then baseline_flag="--baseline $BASELINE"; fi
          dismiss_flag=""
          if [ -n "$BASELINE" ] && [ "$DISMISS_BASELINE" = "true" ]; then dismiss_flag="--dismiss-baseline"; fi
          import_flag=""
          if [ -n "$IMPORT_SARIF" ]; then import_flag="--import $IMPORT_SARIF"; fi
          own_flag=""
          for ref in $OWN_IMAGES; do own_flag="$own_flag --own-image $ref"; done
          "$(go env GOPATH)/bin/scanctl" run $gate_flag $profile_flag $baseline_flag $dismiss_flag $import_flag $own_flag \
            --out scanctl.sarif --sbom sbom.cdx.json \
            --summary scanctl-summary.md "$SCAN_PATH"
          cat scanctl-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4
        with:
          sarif_file: scanctl.sarif
        continue-on-error: true
      - name: Upload SARIF + SBOM artifacts
        # Downloadable findings + SBOM even on private repos without Advanced
        # Security (where the code-scanning upload above is a no-op).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanctl-results
          path: |
            scanctl.sarif
            sbom.cdx.json
          if-no-files-found: ignore
      - name: Comment findings on PR
        # The Security-tab equivalent for private repos: one sticky comment per
        # PR, updated in place. Never fails the run.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- scanctl-summary -->"
          { printf '%s\n\n' "$marker"; cat scanctl-summary.md; } > comment.md
          id="$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi
