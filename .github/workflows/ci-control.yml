name: ci-control
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, auto_merge_enabled]
  workflow_run:
    workflows: [ci]
    types: [completed]
  push:
    branches: [main, release]
  schedule:
    - cron: '7 * * * *'
permissions: {}
jobs:
  control:
    uses: catenahq/contracts/.github/workflows/control.yml@ff0e094463a8ae95aaca41ff5e4a5d5fd339bb7e # main
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: write
      pull-requests: read
    with:
      runner: ubuntu-26.04
      apps: false
      release: false
