name: CI

# Build/vet/test the scanctl binary, then dogfood it: run scanctl on its own
# source, gated like every caller. Its SARIF is uploaded to code scanning.

on:
  # Every pushed branch. Renovate and engine-bump branches always carry a pull
  # request, which tests each push to them.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'scanctl/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: go version
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  repo-rules:
    # Rules every catena repo keeps. The check lives in catenahq/contracts and
    # runs from there.
    name: Repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: scanctl
          persist-credentials: false
      - name: Check out sibling contracts
        uses: catenahq/contracts/.github/actions/checkout-sibling@main
        with:
          repository: catenahq/contracts
          path: contracts
      - name: Repo rules (no tracked env file; .gitignore carries the env rule)
        working-directory: ./scanctl
        run: node ../contracts/scripts/check-repo-rules.mjs

  self-scan:
    name: scanctl scans scanctl (dogfood)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Install uv
        # uv backs guarddog, lazy-fetched at scan time.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build scanctl
        run: go build -o scanctl ./cmd/scanctl
      - name: Run scanctl on itself
        env:
          # zizmor's API-backed audits use this when present; absent = --offline.
          GH_TOKEN: ${{ github.token }}
        run: ./scanctl run --out scanctl.sarif --summary "$GITHUB_STEP_SUMMARY" .
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4
        with:
          sarif_file: scanctl.sarif
        continue-on-error: true
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanctl-sarif
          path: scanctl.sarif
          if-no-files-found: ignore
