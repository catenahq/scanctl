name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '41 6 * * *'
permissions: {}
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: catenahq/contracts/.github/workflows/pr.yml@b1a900783044f4453a2c7af1289501da0c086590 # main
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: write
      security-events: write
      issues: write
    with:
      runner: ubuntu-26.04
