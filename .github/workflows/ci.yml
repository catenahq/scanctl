name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '41 6 * * *'
permissions: {}
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: catenahq/contracts/.github/workflows/pr.yml@ff0e094463a8ae95aaca41ff5e4a5d5fd339bb7e # main
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: write
      security-events: write
      issues: write
    with:
      runner: ubuntu-26.04
